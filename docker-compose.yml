services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asesor
      POSTGRES_PASSWORD: asesor
      POSTGRES_DB: asesor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asesor -d asesor"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://asesor:asesor@db:5432/asesor
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

volumes:
  pgdata:
